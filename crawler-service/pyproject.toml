[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "njupt-crawler-service"
version = "0.1.0"
description = "Controlled official-website crawler for NJUPT AI Assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
