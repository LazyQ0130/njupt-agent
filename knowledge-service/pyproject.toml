[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "njupt-knowledge-service"
version = "0.1.0"
description = "Document ingestion and retrieval service for NJUPT AI Assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.115,<1",
  "langchain-chroma>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "reportlab>=4,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
